          - paragraph [ref=e277]:
            - link "Jon Rodz" [ref=e278] [cursor=pointer]:
              - /url: https://www.jonrodz.com/
            - text: packs a lot of valuable information into his website header. His name appears in bold letters next to his professional headshot. Jon describes himself as a senior UX SCAD student and mentions previous work for companies like Amazon and Adobe. An “Explore my work” button expounds upon his impressive introduction and details his professional experience.
          - paragraph [ref=e279]:
            - text: After his introduction, Jon describes his creative process, highlights
            - link "testimonials from satisfied customers" [ref=e280] [cursor=pointer]:
              - /url: https://webflow.com/blog/how-to-ask-for-a-testimonial
            - text: ", and links to media coverage for his professional and student work. To back up his strong reputation in the field even further, Jon shows a list of design awards he’s won. A thin border around each button indicates what kind of award he won (gold, silver, or bronze) or reflects the award’s brand colors, further communicating his success."
          - paragraph [ref=e281]: Instead of an about section, you can access his journal-style blog, which provides unique insights from his perspective as a young Latino designer. Viewers can then view his professional resumé through the menu at the top of the site, which is accessible from any page.
          - heading "6. Lauren Hung" [level=3] [ref=e282]
