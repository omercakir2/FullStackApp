      - generic [ref=e167]:
        - generic [ref=e168]:
          - paragraph [ref=e169]: "A student portfolio should answer the question: Why you?"
          - generic [ref=e170]:
            - paragraph [ref=e171]: Making a portfolio website puts your best work in front of potential clients, customers, and employers right away. Rather than relying solely on grades and certificates to land a job or project, a digital portfolio creatively demonstrates previous work and achievements in one place.
            - paragraph [ref=e172]:
              - text: Building a strong online student portfolio doesn’t require expert technical skills or coding experience. With the right tools and
              - link "web design ideas" [ref=e173] [cursor=pointer]:
                - /url: https://webflow.com/blog/web-design-portfolios
              - text: ", you can use your portfolio to turn everything you’ve learned into visible proof for others to see your work."
            - paragraph [ref=e174]: Read on to explore seven student portfolio examples with best practices to create a website that can help you stand out from the crowd.
            - list [ref=e176]:
              - listitem [ref=e177]:
                - link "What should a student portfolio include?" [ref=e178] [cursor=pointer]:
                  - /url: "#what-should"
              - listitem [ref=e179]:
                - link "7 digital student portfolio website examples to inspire your design" [ref=e180] [cursor=pointer]:
                  - /url: "#7-examples"
              - listitem [ref=e181]:
                - link "Build your own student portfolio with Webflow" [ref=e182] [cursor=pointer]:
                  - /url: "#build-your-own"
            - heading "What should a student portfolio include?" [level=2] [ref=e183]
            - paragraph [ref=e184]: "With the right mix of details and examples, you can build a website that effectively showcases your capabilities. Here are some portfolio tips for students and design elements to include on your site:"
            - list [ref=e185]:
              - listitem [ref=e186]:
                - strong [ref=e187]: Hero section.
                - text: A hero section is the first thing people see in the topmost area of your homepage. It should include your name, a short tagline, and a
                - link "call to action (CTA)" [ref=e188] [cursor=pointer]:
                  - /url: https://webflow.com/blog/how-to-write-a-call-to-action
                - text: like “View my work” or “Featured projects.” A good hero section immediately tells visitors what you do and sets the tone for the rest of your site.
              - listitem [ref=e189]:
                - strong [ref=e190]: Simple, intuitive navigation.
                - text: Navigation — elements like
                - link "navigation bars (menus)" [ref=e191] [cursor=pointer]:
                  - /url: https://webflow.com/blog/navigation-bar-design
                - text: ", search bars, and links — acts as a map for your visitors. The menu and search bar should be visible and highly legible, with links standing out in a color different from the primary text. If people can quickly find what they’re looking for, they’re more likely to stay and explore."
              - listitem [ref=e192]:
                - strong [ref=e193]: Case study pages.
                - text: Case studies are dedicated pages that tell the full story of your projects, from your initial ideas to the process and results. They help visitors understand what you made and how you think. Adding visuals of the project in process, like sketches, prototypes, or drafts, to showcase your decisions along the way is another helpful tool to entice visitors.
              - listitem [ref=e194]:
                - strong [ref=e195]: Featured projects or galleries.
                - text: Exhibit your strongest projects on the homepage, either as large feature cards or in a clean grid. Each project you feature should include a visual and a short description. Linking case study pages can also give you room to analyze and explore what made that project great. This gallery gives people an overview of what you’re able to do before learning more.
              - listitem [ref=e196]:
                - strong [ref=e197]: Skills and tools section.
                - text: Add a list or set of icons for the tools, languages, or software you know best. It helps potential clients and recruiters know if you have the right technical or creative skills for a role or project.
              - listitem [ref=e198]:
                - strong [ref=e199]: About section.
                - text: Write a brief, friendly professional bio that explains who you are, what you’re passionate about, and what you’re working toward. The ideal length depends on your field and achievements, but preferably brief. If you’re comfortable, including a professional photo of yourself adds personality and makes your student portfolio design feel authentic and approachable.
              - listitem [ref=e200]:
                - strong [ref=e201]: Contact section.
                - text: Make it as easy as possible for people to reach you. If comfortable, include your email, social media profile links (if they reflect your professional life), or a
                - link "simple contact form" [ref=e202] [cursor=pointer]:
                  - /url: https://webflow.com/blog/contact-form-on-website
                - text: at the bottom of your site. Guide them toward interaction with a CTA like “Get in touch” or “Let’s work together!” at the end of the browsing experience.
              - listitem [ref=e203]:
                - strong [ref=e204]: High-quality visuals.
                - text: High-resolution images, video clips, and animations to demonstrate your student work can make the user experience more engaging. Visuals help people understand your content better than words alone and encourage visitors to interact with elements.
              - listitem [ref=e205]:
                - strong [ref=e206]: Testimonials.
                - text: If you have them available, include short quotes and recommendations from professors, mentors, or clients who can vouch for your student work. They add credibility to your
                - link "personal brand" [ref=e207] [cursor=pointer]:
                  - /url: https://webflow.com/blog/personal-website-examples
                - text: ", make you more marketable, and build trust with website visitors."
              - listitem [ref=e208]:
                - strong [ref=e209]: Resumé or CV.
                - text: Linking a PDF of your resumé or CV is a practical method for employers who want to share your details internally and allows them easy access to all necessary information in one place. You can also link your LinkedIn profile as another source of information for recruiters to review.
              - listitem [ref=e210]:
                - strong [ref=e211]: Responsive design.
                - text: A
                - link "responsive website" [ref=e212] [cursor=pointer]:
                  - /url: https://webflow.com/blog/responsive-web-design
                - text: automatically adapts to all devices, mobile or desktop, without sacrificing the design or functionality. Many people will view your site on a mobile device first, so it’s important to test your site on different screens to ensure the layout loads smoothly and works properly.
              - listitem [ref=e213]:
                - strong [ref=e214]: SEO.
                - text: A well-optimized website is more likely to appear in search results when people search for your name or industry on Google and other search engines.
                - link "Search engine optimization (SEO)" [ref=e215] [cursor=pointer]:
                  - /url: https://webflow.com/blog/tools-for-seo
                - text: includes adding descriptive titles, meta tags, and high-traffic keywords to your site.
              - listitem [ref=e216]:
                - strong [ref=e217]: Accessibility.
                - link "Building an accessible site" [ref=e218] [cursor=pointer]:
                  - /url: https://webflow.com/blog/why-is-web-accessibility-important
                - text: means that it is usable for everyone and shows attention to detail and a commitment to inclusivity. Use legible colors with high contrast, alt text for images, and a clear text hierarchy for better readability.
            - heading "7 digital student portfolio website examples to inspire your design" [level=2] [ref=e219]
            - paragraph [ref=e220]: To see how design elements, layout structures, and storytelling can make effective websites in practice, here are seven websites to use as inspiration for your student portfolio.
            - heading "1. Gerardo Orozco" [level=3] [ref=e221]
            - figure [ref=e222]:
              - generic [ref=e224]:
                - emphasis [ref=e225]: "Source:"
                - link [ref=e226] [cursor=pointer]:
                  - /url: https://www.eygerardo.com/
                  - emphasis [ref=e227]: Gerardo Orozco
            - paragraph [ref=e228]:
              - link "Gerardo Orozco" [ref=e229] [cursor=pointer]:
                - /url: https://www.eygerardo.com/
              - text: "opens their student portfolio with their first name in bold letters and a list of three facts about their personality: They love cats, they’re a graphic designer, and they're a self-described “awkward human.” This introduction differentiates their profile and immediately shows that they’re approachable and humorous while still retaining a professional edge."
            - paragraph [ref=e230]:
              - text: Scrolling reveals a curated project list. The images cover the entire screen, making the visuals stand out, with a
              - link "hard-to-miss client name button" [ref=e231] [cursor=pointer]:
                - /url: https://webflow.com/blog/cta-button-colors
              - text: in the middle that takes you to dedicated case study pages. Each page then covers branding and packaging, with room to showcase Gerardo’s approach and thinking during the creative process.
            - heading "2. Ruben Hernandez" [level=3] [ref=e232]
            - figure [ref=e233]:
              - generic [ref=e235]:
                - emphasis [ref=e236]: "Source:"
                - link [ref=e237] [cursor=pointer]:
                  - /url: https://ruben-hernandez-portfolio.webflow.io/
                  - emphasis [ref=e238]: Ruben Hernandez
            - paragraph [ref=e239]:
              - link "Ruben Hernandez" [ref=e240] [cursor=pointer]:
                - /url: https://ruben-hernandez-portfolio.webflow.io/
              - text: ’s student website follows a minimalist approach to spotlight their student work. Their “About” link takes you to a concise description explaining Ruben’s journey along with a playful video of them skating. Condensing his background on a separate page gives the homepage room to focus on a large visual compilation of Ruben’s projects.
            - paragraph [ref=e241]: The “Work” section redirects viewers to the homepage, which highlights different projects with large thumbnails and hover-triggered animations, prompting you to explore. Once you do, each page has a “Story-Challenge-Opportunity” structure showing Ruben’s approach to each project, followed by several visual samples.
            - heading "3. Tim DP" [level=3] [ref=e242]
            - figure [ref=e243]:
              - generic [ref=e245]:
                - emphasis [ref=e246]: "Source:"
                - link [ref=e247] [cursor=pointer]:
                  - /url: https://www.timdp.ca/
                  - emphasis [ref=e248]: Tim DP
            - paragraph [ref=e249]:
              - text: Unlike traditional top-to-bottom websites,
              - link "Tim DP" [ref=e250] [cursor=pointer]:
                - /url: https://www.timdp.ca/
              - text: ’s digital portfolio scrolls horizontally. It’s an attention-catching,
              - link "unique portfolio design" [ref=e251] [cursor=pointer]:
                - /url: https://webflow.com/blog/design-portfolio-examples
              - text: that encourages viewer interaction. The short description “Physical & digital designer” on the homepage makes it very clear what Tim does, and viewers can toggle between their digital and physical work to see the most relevant projects.
            - paragraph [ref=e252]: An “Info” button takes you to an about page, where Tim lists their experiences, services provided, and distinctions in more detail. Tim’s website makes it easy for potential clients and recruiters to reach out by linking to their email and social media profiles on the right-hand side of the page.
        - list [ref=e255]:
          - listitem [ref=e256]:
            - generic [ref=e257]:
              - generic [ref=e260]:
                - paragraph [ref=e261]: Launch with Webflow Templates
                - paragraph [ref=e262]: Choose from hundreds of professionally designed website templates for any industry or style. Customize visually, launch instantly — no coding required.
