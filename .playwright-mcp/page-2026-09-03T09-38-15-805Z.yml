            - text: introduces herself as a product designer, maker, and sketcher, immediately giving viewers a clear picture of who she is and what she does. Her student site has two sections — a portfolio and an about page. Viewers can also download Lauren’s resumé via a dedicated button in the header menu.
          - paragraph [ref=e291]: "The portfolio section of Lauren’s website has large thumbnails with descriptions of each project that you can click on for more details. Each case study page has several elements that walk you through Lauren’s decision-making process: an overview, scope, prototyping, collection of experiences, final proposal, value to the client, and post-project reflections. Her analysis leaves no room for confusion and simultaneously communicates her work’s value."
          - paragraph [ref=e292]: The about section has a similar structure, with “Where I came from,” “Where I’m going,” and “Meanwhile” descriptions. A smart headshot shows her professional side, but hovering over the image changes it to a more casual and friendly, smiling image of Lauren. There are similar hover-triggered images throughout the website that show her interactive design skills in action.
