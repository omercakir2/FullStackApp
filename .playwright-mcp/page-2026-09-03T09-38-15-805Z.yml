          - paragraph [ref=e302]: An archive page shows Yichen’s prior work, highlighting his growth over time. Additionally, his about section showcases his work experience at reputable companies like Microsoft. In addition to his education, Yichen lists his skill set, making it easy for potential employers to match him to specific projects.
